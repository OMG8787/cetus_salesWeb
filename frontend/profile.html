<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>個人資料 - AOI 業務系統</title>
<link rel="stylesheet" href="style.css?v=20261007b" />
<link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png" />
<link rel="apple-touch-icon" href="img/icon-192.png" />
</head>
<body>

<div id="loading-overlay" class="loading-overlay" style="display:none;">
  <div class="loading-box"><div class="spinner"></div><div>處理中，請稍候...</div></div>
</div>

<header>
  <h1>AOI 業務系統</h1>
  <div><span id="current-user"></span><button onclick="logout()">登出</button></div>
</header>
<nav class="tabs tabs-grouped">
  <button class="tab-btn nav-single" onclick="location.href='home.html'">首頁</button>
  <div class="nav-group">
    <button class="nav-group-btn" onclick="location.href='products.html'">業務工具 ▾</button>
    <div class="nav-dropdown">
      <button class="tab-btn" onclick="location.href='products.html'">產品搜尋 / 詢價</button>
      <button class="tab-btn" onclick="location.href='calc.html'">選型計算</button>
      <button class="tab-btn" onclick="location.href='quote.html'">報價系統</button>
    </div>
  </div>
  <div class="nav-group">
    <button class="nav-group-btn" onclick="location.href='cases.html'">案件與客戶 ▾</button>
    <div class="nav-dropdown">
      <button class="tab-btn" onclick="location.href='cases.html'">案件管理</button>
      <button class="tab-btn" onclick="location.href='customers.html'">客戶管理</button>
      <button class="tab-btn" onclick="location.href='evalreport.html'">評估報告（自由製作）</button>
    </div>
  </div>
  <div class="nav-group">
    <button class="nav-group-btn" onclick="location.href='devices.html'">系統 ▾</button>
    <div class="nav-dropdown">
      <button class="tab-btn" onclick="location.href='devices.html'">登入紀錄</button>
      <button class="tab-btn admin-only" onclick="location.href='staff.html'">人員管理</button>
      <button class="tab-btn admin-only" onclick="location.href='users.html'">帳號管理</button>
    </div>
  </div>
</nav>

<section class="tab-content">
  <h2>個人資料設定</h2>

  <div class="home-card">
    <h3>修改密碼 <span class="calc-hint">更新登入密碼以提升帳號安全</span></h3>
    <div id="pw-panel">
      <input id="pw-old" type="password" placeholder="目前的密碼" autocomplete="current-password" />
      <input id="pw-new" type="password" placeholder="新密碼（至少 6 個字）" autocomplete="new-password" />
      <input id="pw-new2" type="password" placeholder="再輸入一次新密碼" autocomplete="new-password" />
      <button onclick="changePassword()">確認修改密碼</button>
      <div id="pw-message" class="calc-hint"></div>
    </div>
  </div>

  <div class="home-card" style="margin-top:14px;">
    <h3>會員資料修改 <span class="calc-hint">更新姓名、電話、信箱等基本資料</span></h3>
    <div id="profile-panel">
      <label>帳號（不可修改）<input id="pf-username" disabled /></label>
      <label>身分 <input id="pf-role" disabled /></label>
      <label>姓名 <span style="color:#c0392b">*</span><input id="pf-name" /></label>
      <label>電話<input id="pf-phone" /></label>
      <label>電子郵件<input id="pf-email" type="email" /></label>
      <label>生日<input id="pf-birthday" type="date" /></label>
      <button onclick="saveProfile()">確認修改</button>
      <div id="pf-message" class="calc-hint"></div>
    </div>
  </div>
</section>

<script src="config.js?v=20261007b"></script>
<script src="demo.js?v=20261007b"></script>
<script src="common.js?v=20261007b"></script>
<script src="profile.js?v=20261007b"></script>
</body>
</html>
