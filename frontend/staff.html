<section class="tab-content">
  <h2>人員管理</h2>
  <p class="calc-hint">
    這裡管理的是案件管理頁「業務／FAE」欄位自動完成用的人員清單，跟登入帳號（帳號管理）是分開的兩件事——
    同一個人可能有登入帳號，也可能只是被指派在案件上但不需要登入系統。只有 <strong>管理員（admin）</strong> 能新增/修改/刪除。
  </p>

  <h3>新增人員</h3>
  <div id="staff-add-panel">
    <input id="staff-name" placeholder="姓名（必填）" />
    <select id="staff-role">
      <option value="業務">業務</option>
      <option value="FAE">FAE</option>
      <option value="其他">其他</option>
    </select>
    <button onclick="addStaff()">新增</button>
  </div>

  <h3>人員列表</h3>
  <button onclick="loadStaff()">重新整理</button>
  <div id="staff-message" class="calc-hint"></div>
  <table id="staff-table" style="display:none;">
    <thead><tr><th>姓名</th><th>角色</th><th>操作</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>軟體名稱清單</h2>
  <p class="calc-hint">案件的「軟體名稱」是從這份清單下拉選擇。案件頁輸入清單裡沒有的名稱時，會詢問是否新增；也可以在這裡直接新增或刪除。</p>
  <div id="software-add-panel">
    <input id="software-name" placeholder="軟體名稱" />
    <button onclick="addSoftwareName()">新增</button>
  </div>
  <table id="software-table" style="display:none;">
    <thead><tr><th>軟體名稱</th><th>操作</th></tr></thead>
    <tbody></tbody>
  </table>
</section>
