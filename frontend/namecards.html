<section class="tab-content wide">
  <h2>名片客戶專區</h2>
  <div class="calc-hint">LINE 傳給員工助理的名片、辨識完會放在這裡（歸在你自己的帳號下，需先在「BOT 設定 → 員工助理」綁定 LINE）。辨識錯的地方按「編輯」自己改；確認後按「登入成客戶」：公司已是客戶就新增為聯絡窗口；還不是客戶的會問你要登入成「一般客戶」還是放進「陌生開發名單」（來源標名片）。</div>
  <div class="nc-bar">
    <select id="nc-filter" onchange="renderCards()">
      <option value="all">全部</option>
      <option value="pending" selected>待登入</option>
      <option value="saved">已登入</option>
    </select>
    <input id="nc-search" placeholder="搜尋姓名 / 公司 / 電話 / Email / 註記" oninput="renderCards()" />
    <span id="nc-count" class="calc-hint"></span>
  </div>
  <div class="nc-scroll">
    <table class="nc-table">
      <thead>
        <tr>
          <th>狀態</th><th>姓名</th><th>職稱</th><th>公司</th><th>手機</th><th>公司電話</th><th>傳真</th><th>Email</th><th>地址</th><th>統編</th><th>網站</th><th>備註</th><th>註記 / 時間</th>
          <th class="nc-act">操作</th>
        </tr>
      </thead>
      <tbody id="nc-body"></tbody>
    </table>
  </div>
  <div id="nc-empty" class="calc-hint" style="display:none;padding:10px 0;"></div>
</section>

<div id="nc-edit-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box" style="max-width:560px;">
    <div class="modal-header"><h3 style="margin:0;">編輯名片 <span id="nce-id"></span></h3><button type="button" onclick="closeModal('nc-edit-modal')">關閉</button></div>
    <div class="calc-hint">只修改這張名片的資料；已經登入的客戶資料不會被改到（要改請到「客戶管理」）。</div>
    <label>姓名：</label><input id="nce-name" />
    <label>職稱：</label><input id="nce-title" />
    <label>公司：</label><input id="nce-company" />
    <label>手機：</label><input id="nce-phone" />
    <label>公司電話：</label><input id="nce-companyPhone" />
    <label>傳真：</label><input id="nce-fax" />
    <label>Email：</label><input id="nce-email" />
    <label>地址：</label><input id="nce-address" />
    <label>統一編號：</label><input id="nce-taxId" maxlength="8" />
    <label>網站：</label><input id="nce-website" />
    <label>備註：</label><textarea id="nce-note" rows="2"></textarea>
    <div style="margin-top:10px;"><button type="button" onclick="saveEdit()">儲存</button></div>
  </div>
</div>

<div id="nc-cal-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box" style="max-width:480px;">
    <div class="modal-header"><h3 style="margin:0;">新增聯繫行事曆</h3><button type="button" onclick="closeModal('nc-cal-modal')">關閉</button></div>
    <div class="calc-hint">會加到你自己的「業務行事曆」，到時間前往行事曆就看得到。</div>
    <label>標題：</label><input id="ncc-title" />
    <label>日期：</label><input id="ncc-date" type="date" />
    <span id="ncc-quick"></span>
    <label style="display:block;margin-top:6px;">時間（不填 = 全天）：</label><input id="ncc-time" type="time" />
    <label>備註：</label><textarea id="ncc-notes" rows="4"></textarea>
    <div style="margin-top:10px;"><button type="button" onclick="saveCalendar()">加入行事曆</button></div>
  </div>
</div>
