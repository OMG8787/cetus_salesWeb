<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>客戶管理 - AOI 業務系統</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="loading-overlay" class="loading-overlay" style="display:none;">
  <div class="loading-box"><div class="spinner"></div><div>處理中，請稍候...</div></div>
</div>

<header>
  <h1>AOI 業務系統</h1>
  <div><span id="current-user"></span><button onclick="logout()">登出</button></div>
</header>
<nav class="tabs">
  <button class="tab-btn" onclick="location.href='products.html'">產品搜尋 / 詢價</button>
  <button class="tab-btn" onclick="location.href='calc.html'">選型計算</button>
  <button class="tab-btn" onclick="location.href='cases.html'">案件管理</button>
  <button class="tab-btn" onclick="location.href='quote.html'">報價系統</button>
  <button class="tab-btn active" onclick="location.href='customers.html'">客戶管理</button>
  <button class="tab-btn" onclick="location.href='report.html'">日報</button>
</nav>

<section class="tab-content">
  <h2>新增客戶</h2>
  <div id="customer-add-panel">
    <input id="cust-company" placeholder="公司名稱" />
    <input id="cust-contact" placeholder="聯絡人" />
    <input id="cust-phone" placeholder="電話" />
    <input id="cust-email" placeholder="Email" />
    <label>客戶分類：</label>
    <select id="cust-category">
      <option value="設備商">設備商</option>
      <option value="代理商">代理商</option>
      <option value="終端客戶">終端客戶</option>
      <option value="其他">其他</option>
    </select>
    <label>急迫性：</label>
    <select id="cust-urgency">
      <option value="高">高</option>
      <option value="中" selected>中</option>
      <option value="低">低</option>
    </select>
    <label>下次追蹤日：</label>
    <input id="cust-followup" type="date" />
    <button onclick="addCustomer()">新增（有填追蹤日會自動加到你的 Google 日曆）</button>
  </div>

  <h2>客戶列表</h2>
  <div>
    篩選：
    <select id="cust-filter-category" onchange="renderCustomerTable()">
      <option value="">全部分類</option>
      <option value="設備商">設備商</option>
      <option value="代理商">代理商</option>
      <option value="終端客戶">終端客戶</option>
      <option value="其他">其他</option>
    </select>
    <select id="cust-filter-urgency" onchange="renderCustomerTable()">
      <option value="">全部急迫性</option>
      <option value="高">高</option>
      <option value="中">中</option>
      <option value="低">低</option>
    </select>
    <button onclick="loadCustomers()">重新整理</button>
  </div>
  <table id="customer-table">
    <thead><tr><th>公司</th><th>聯絡人</th><th>電話</th><th>分類</th><th>急迫性</th><th>下次追蹤日</th><th>操作</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>新增客戶聯繫紀錄</h2>
  <div id="contact-log-panel">
    <input id="log-company" placeholder="公司名稱" list="customer-company-list" />
    <datalist id="customer-company-list"></datalist>
    <input id="log-contact" placeholder="聯絡人" />
    <select id="log-method">
      <option value="電話">電話</option>
      <option value="Email">Email</option>
      <option value="拜訪">拜訪</option>
      <option value="其他">其他</option>
    </select>
    <textarea id="log-summary" placeholder="聯繫內容摘要"></textarea>
    <button onclick="addContactLog()">新增聯繫紀錄</button>
  </div>
</section>

<div id="preview-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <div class="modal-header"><h3>文件預覽</h3><button onclick="closePreviewModal()">關閉</button></div>
    <div id="preview-modal-list"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="demo.js"></script>
<script src="common.js"></script>
<script src="customers.js"></script>
</body>
</html>
