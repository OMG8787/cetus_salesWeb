<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script src="theme.js?v=20261108a"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>首頁 - AOI 業務系統</title>
<link rel="stylesheet" href="style.css?v=20261108a" />
<link rel="stylesheet" href="dark.css?v=20261108a" />
<link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png" />
<link rel="apple-touch-icon" href="img/icon-192.png" />
</head>
<body>

<div id="loading-overlay" class="loading-overlay" style="display:none;">
  <div class="loading-box"><div class="spinner"></div><div>處理中，請稍候...</div></div>
</div>

<header>
  <h1>AOI 業務系統</h1>
  <div><span id="current-user"></span><button onclick="logout()">登出</button></div>
</header>
<nav class="tabs tabs-grouped">
  <button class="tab-btn nav-single active" onclick="location.href='home.html'">首頁</button>
  <div class="nav-group">
    <button class="nav-group-btn" onclick="location.href='products.html'">業務工具 ▾</button>
    <div class="nav-dropdown">
      <button class="tab-btn" data-block="products" onclick="location.href='products.html'">產品搜尋 / 詢價</button>
      <button class="tab-btn" data-block="products" onclick="location.href='calc.html'">選型計算</button>
      <button class="tab-btn" data-block="products" onclick="location.href='quote.html'">報價系統</button>
    </div>
  </div>
  <div class="nav-group">
    <button class="nav-group-btn" onclick="location.href='cases.html'">案件與客戶 ▾</button>
    <div class="nav-dropdown">
      <button class="tab-btn" data-block="cases" onclick="location.href='cases.html'">案件管理</button>
      <button class="tab-btn" data-block="customers" onclick="location.href='customers.html'">客戶管理</button>
      <button class="tab-btn" data-block="customers" onclick="location.href='namecards.html'">名片客戶專區</button>
      <button class="tab-btn" data-block="cases customers" onclick="location.href='schedule.html'">業務行事曆</button>
      <button class="tab-btn" onclick="location.href='todos.html'">工作清單</button>
    </div>
  </div>
  <div class="nav-group">
    <button class="nav-group-btn" onclick="location.href='evalreport.html'">檔案製作 ▾</button>
    <div class="nav-dropdown">
      <button class="tab-btn" data-block="files" onclick="location.href='evalreport.html'">評估報告（自由製作）</button>
      <button class="tab-btn" data-block="files" onclick="location.href='marketing.html'">行銷宣傳製作</button>
      <button class="tab-btn" data-block="copy" onclick="location.href='copy.html'">文案製作</button>
    </div>
  </div>
  <div class="nav-group">
    <button class="nav-group-btn" data-block="bot" onclick="location.href='bot.html'">BOT 設定 ▾</button>
    <div class="nav-dropdown">
      <button class="tab-btn" data-block="bot" onclick="location.href='bot.html'">客服機器人</button>
      <button class="tab-btn" data-block="bot" onclick="location.href='bot.html#staff'">員工助理</button>
    </div>
  </div>
  <div class="nav-group">
    <button class="nav-group-btn" onclick="location.href='devices.html'">系統 ▾</button>
    <div class="nav-dropdown">
      <button class="tab-btn" onclick="location.href='devices.html'">登入紀錄</button>
      <button class="tab-btn admin-only" onclick="location.href='staff.html'">人員管理</button>
      <button class="tab-btn admin-only" onclick="location.href='users.html'">帳號管理</button>
    </div>
  </div>
</nav>

<section class="tab-content wide">
  <h2 id="home-greeting">首頁</h2>

  <div class="home-grid">
    <!-- 常用網站 -->
    <div class="home-card">
      <h3>常用網站
        <span class="card-actions">
          <button onclick="openAllSites()" title="一次開啟所有標了「預設開啟」的網站">▶ 一鍵開啟預設網站</button>
          <button class="btn-secondary" onclick="toggleSiteEdit()">編輯</button>
        </span>
      </h3>
      <div id="site-list" class="site-list"></div>
      <div id="site-hint" class="calc-hint"></div>
      <div id="site-edit" style="display:none;">
        <div id="site-edit-rows"></div>
        <div class="toolbar">
          <button class="btn-secondary" onclick="addSiteRow()">＋ 新增網站</button>
          <button onclick="saveSites()">儲存</button>
          <button class="btn-secondary" onclick="toggleSiteEdit()">取消</button>
        </div>
        <div class="calc-hint">網址不用打 https://。勾「預設開啟」的網站，會在按「一鍵開啟預設網站」時一起開。</div>
      </div>
    </div>

    <!-- 行程 -->
    <div class="home-card">
      <h3>我的行事曆
        <span class="card-actions">
          <select id="cal-days" onchange="loadEvents()">
            <option value="1">今天</option>
            <option value="7" selected>未來 7 天</option>
            <option value="30">未來 30 天</option>
          </select>
          <button class="btn-secondary" onclick="location.href='schedule.html'">開啟行事曆</button>
        </span>
      </h3>
      <div id="event-list"></div>
      <div class="calc-hint">每個帳號各自的行事曆（含別人分享給你的）；客戶的「下次追蹤」會自動加進來。</div>
    </div>

    <!-- 工作清單 -->
    <div class="home-card">
      <h3>工作清單
        <span class="card-actions"><button class="btn-secondary" onclick="location.href='todos.html'">開啟工作清單</button></span>
      </h3>
      <div class="toolbar"><input id="todo-quick" placeholder="新增一項工作，按 Enter" maxlength="200" /></div>
      <div id="todo-list"></div>
    </div>

    <!-- 常用型號 -->
    <div class="home-card">
      <h3>常用型號
        <span class="card-actions"><button class="btn-secondary" onclick="location.href='products.html?fav=1'">到產品頁查看 / 詢價</button></span>
      </h3>
      <div id="fav-list" class="site-list"></div>
      <div class="calc-hint">在「產品搜尋」按產品前面的 ☆ 就會加入常用。</div>
    </div>

    <!-- 備忘錄 -->
    <div class="home-card">
      <h3>備忘錄
        <span class="card-actions">
          <select id="memo-filter" onchange="renderMemos()">
            <option value="all">全部</option>
            <option value="mine">只看我的</option>
            <option value="shared">別人分享的</option>
          </select>
        </span>
      </h3>
      <div id="memo-add">
        <input id="memo-title" placeholder="標題（選填）" />
        <textarea id="memo-content" placeholder="內容"></textarea>
        <div id="memo-share" style="margin:6px 0;"></div>
        <div class="toolbar">
          <button onclick="addMemo()">新增備忘</button>
        </div>
      </div>
      <div id="memo-list"></div>
    </div>
  </div>
</section>

<div id="memo-share-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box" style="max-width:480px;">
    <div class="modal-header"><h3 style="margin:0;">備忘錄的分享對象</h3><button type="button" class="btn-secondary" onclick="document.getElementById('memo-share-modal').style.display='none'">關閉</button></div>
    <input type="hidden" id="memo-share-row" />
    <div id="memo-share-edit"></div>
    <div style="margin-top:10px;"><button type="button" onclick="saveMemoShare()">儲存</button></div>
  </div>
</div>

<script src="config.js?v=20261108a"></script>
<script src="demo.js?v=20261108a"></script>
<script src="common.js?v=20261108a"></script>
<script src="share.js?v=20261108a"></script>
<script src="assistant.js?v=20261108a"></script>
<script src="alerts.js?v=20261108a"></script>
<script src="home.js?v=20261108a"></script>
</body>
</html>
